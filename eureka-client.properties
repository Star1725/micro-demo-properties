# 0 - для автоматического присваивания, если нужно вручную, то начинаем с 8080
server.port=0

spring.application.name=eureka-client

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# настройка цветов длят лога
spring.output.ansi.enabled=DETECT

# формат вывода логов
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr([%-5level]) %clr(%logger{36}){cyan} - %msg%n

# для того чтобы каждый инстанс (экземпляр) имел уникальный id
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

tmpVar=500
